# Local-dev infrastructure only (Postgres + Redis). The backend (venv) and
# frontend (npm) still run on the host as documented in README.md — full
# containerization of the app itself is a separate, later step (see
# CONTEXT.md Status: "production deployment").

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cme
      POSTGRES_PASSWORD: cme_dev_password
      POSTGRES_DB: cme_registration
    ports:
      - "5432:5432"
    volumes:
      - cme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cme -d cme_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cme_postgres_data:
